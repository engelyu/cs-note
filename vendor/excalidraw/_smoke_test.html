<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Excalidraw vendor smoke test</title>
<link rel="stylesheet" href="./excalidraw.css">
<style>html,body,#app{height:100%;margin:0;}</style>
<script>
  // Minimal browser shim for bundled code that still references a Node-style
  // `process` global at module-eval time (found via static grep before this
  // test — see docs/superpowers/specs/2026-08-07-excalidraw-embed-design.md).
  window.process = window.process || { argv: [], env: { NODE_ENV: 'production' }, on: function () {}, versions: {}, version: '' };
  window.EXCALIDRAW_ASSET_PATH = './';
</script>
<script type="importmap">
{
  "imports": {
    "react": "./react.js",
    "react-dom": "./react-dom.js",
    "react-dom/client": "./react-dom.js",
    "react/jsx-runtime": "./react-jsx-runtime.js",
    "@excalidraw/excalidraw": "./excalidraw.js"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { createRoot } from 'react-dom/client';
  import { createElement as h } from 'react';
  import { Excalidraw, convertToExcalidrawElements } from '@excalidraw/excalidraw';

  window.__smokeError = null;
  window.addEventListener('error', (e) => { window.__smokeError = String(e.error || e.message); });

  const boundaryScene = convertToExcalidrawElements([
    { type: 'ellipse', id: 'node:smoke', x: 0, y: 0, width: 64, height: 64, label: { text: 'S' } },
    { type: 'arrow', id: 'edge:smoke', x: 0, y: 0, width: 64, height: 0, points: [[0, 0], [64, 0]], start: { id: 'node:smoke' }, end: { id: 'node:smoke' } },
  ], { regenerateIds: false });
  window.__smokeStableIds = {
    node: boundaryScene.some((element) => element.id === 'node:smoke'),
    edge: boundaryScene.some((element) => element.id === 'edge:smoke'),
    label: boundaryScene.some((element) => element.containerId === 'node:smoke'),
  };
  document.body.dataset.smokeStableIds = Object.values(window.__smokeStableIds).join(',');

  const root = createRoot(document.getElementById('app'));
  root.render(h(Excalidraw, {}));
  window.__smokeMounted = true;
</script>
</body>
</html>
