name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify semantic artifacts and tests
        run: npm test
      - name: Verify Excalidraw vendor output
        run: |
          npm run vendor:excalidraw
          git diff --exit-code -- vendor/excalidraw
      - name: Build production site
        run: npm run build
